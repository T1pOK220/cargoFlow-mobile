name: cargo_flow
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.1.0
  provider: ^6.1.5+1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#F4F1EC"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#F4F1EC"
  image: assets/splash/splash_logo.png
  fullscreen: true
  android_12:
    color: "#F4F1EC"
    image: assets/splash/splash_icon.png
    icon_background_color: "#F4F1EC"

flutter:
  uses-material-design: true
  assets:
    - assets/images/